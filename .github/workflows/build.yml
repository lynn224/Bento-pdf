name: Build Aplikasi Offline
on: workflow_dispatch

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Ekstrak File ZIP dengan Aman
        shell: bash
        run: |
          unzip -q *.zip -d temp_dir
          ROOT_DIR=$(dirname "$(find temp_dir -name 'package.json' | head -n 1)")
          mv "$ROOT_DIR" project_folder
          
      - name: Injeksi package.json
        shell: bash
        run: |
          cat << 'EOF' > project_folder/package.json
          {
            "name": "bento-pdf",
            "author": "An_",
            "description": "BentoPDF Offline App",
            "private": true,
            "version": "1.0.0",
            "license": "Apache-2.0",
            "type": "module",
            "main": "electron/main.cjs",
            "scripts": {
              "dev": "vite",
              "prebuild": "node scripts/copy-offline-assets.mjs",
              "build": "vite build",
              "preview": "vite preview",
              "obfuscate": "node scripts/build.mjs",
              "test": "vitest",
              "test:ui": "vitest --ui",
              "test:run": "vitest run",
              "test:coverage": "vitest run --coverage",
              "test:watch": "vitest watch",
              "build:docker": "vite build",
              "electron:dev": "npm run build && electron .",
              "electron:build:win": "npm run build && electron-builder --win"
            },
            "devDependencies": {
              "@testing-library/dom": "^10.4.1",
              "@types/blob-stream": "^0.1.33",
              "@types/html2canvas": "^0.5.35",
              "@types/pdfkit": "^0.17.3",
              "@types/sortablejs": "^1.15.8",
              "@types/utif": "^3.0.6",
              "@vitest/coverage-v8": "^3.2.4",
              "@vitest/ui": "^3.2.4",
              "electron": "^33.0.0",
              "electron-builder": "^25.1.8",
              "jsdom": "^27.0.0",
              "ts-migrate": "^0.1.35",
              "typescript": "~5.9.3",
              "vite": "^7.1.7",
              "vite-plugin-node-polyfills": "^0.24.0",
              "vitest": "^3.2.4"
            },
            "build": {
              "appId": "com.bentopdf.app",
              "productName": "BentoPDF",
              "files": ["dist/**/*", "electron/**/*"],
              "directories": {"output": "release"},
              "win": {
                "target": [
                  { "target": "nsis", "arch": ["x64"] },
                  { "target": "portable", "arch": ["x64"] }
                ]
              },
              "nsis": {
                "oneClick": false,
                "allowToChangeInstallationDirectory": true,
                "createDesktopShortcut": true
              }
            },
            "dependencies": {
              "@embedpdf/models": "^2.15.0",
              "@embedpdf/pdfium": "^2.15.0",
              "@embedpdf/snippet": "^2.15.0",
              "@fontsource/cedarville-cursive": "^5.2.5",
              "@fontsource/dancing-script": "^5.2.5",
              "@fontsource/dm-sans": "^5.2.5",
              "@fontsource/great-vibes": "^5.2.5",
              "@fontsource/kalam": "^5.2.5",
              "@fontsource/lato": "^5.2.5",
              "@fontsource/merriweather": "^5.2.5",
              "@tailwindcss/vite": "^4.1.14",
              "blob-stream": "^0.1.3",
              "cropperjs": "^1.6.1",
              "heic2any": "^0.0.4",
              "html2canvas": "^1.4.1",
              "javascript-obfuscator": "^4.1.1",
              "jspdf": "^3.0.3",
              "jszip": "^3.10.1",
              "lucide": "^0.545.0",
              "pdf-lib": "^1.17.1",
              "pdfjs-dist": "^5.4.296",
              "pdfkit": "^0.17.2",
              "sortablejs": "^1.15.6",
              "tailwindcss": "^4.1.14",
              "terser": "^5.44.0",
              "tesseract.js": "^6.0.1",
              "tiff": "^7.1.2",
              "utif": "^3.1.0"
            }
          }
          EOF

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          
      - name: Jalankan Build (.exe)
        shell: bash
        run: |
          cd project_folder
          npm install
          node -e "const fs=require('fs'); const p='node_modules/@embedpdf/pdfium/package.json'; if(fs.existsSync(p)){ const d=JSON.parse(fs.readFileSync(p)); delete d.exports; fs.writeFileSync(p, JSON.stringify(d)); }" || true
          export NODE_OPTIONS="--max-old-space-size=4096"
          npm run electron:build:win

      - name: Simpan Aplikasi Windows
        uses: actions/upload-artifact@v4
        with:
          name: BentoPDF-Offline-Installer
          path: project_folder/release/*.exe
